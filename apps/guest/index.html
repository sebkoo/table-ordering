<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu</title>
    <!--
      The styles are inline, and the font is whatever the phone already has.
      A stylesheet or a font from somewhere else is a request to somewhere
      else, and a guest reading a menu at a table does not need one.
    -->
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      body { margin: 0; }
      main { max-width: 32rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
      h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 0.75rem 0;
        border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      }
      /* The table's name belongs to the heading above it, not to the list
         below it. Without this it renders at an item's weight, a step from the
         first item and two from the restaurant, and reads as a line of the
         menu that forgot its price. */
      .table {
        margin: -1rem 0 1.5rem;
        color: color-mix(in srgb, currentColor 65%, transparent);
      }
      .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
      /* The name takes the slack, so the price and the quantity stay together
         at the end of the row whatever the item is called. */
      .name { flex: 1; }
      /* `font: inherit` on both controls, because a form control otherwise
         ignores the family set on :root and renders in the platform's own --
         which is the one thing this page says it does not go and fetch. */
      .quantity, .send {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
        border-radius: 0.375rem;
      }
      .quantity { width: 3.5rem; padding: 0.25rem 0.5rem; text-align: right; }
      .send { width: 100%; padding: 0.875rem 1rem; border-color: currentColor; }
      .quantity:disabled, .send:disabled { opacity: 0.45; }
      [data-order] { margin-top: 2rem; }
      .pending, .outcome { margin: 0 0 0.75rem; }
      .pending { font-variant-numeric: tabular-nums; }
      .outcome { color: color-mix(in srgb, currentColor 70%, transparent); }
      /* What the table has already sent. Its rows are one string rather than a
         name and a price at opposite edges, so the flex rule above would stretch
         a single round across the width and rule a menu's separator under
         something that is not a menu. */
      [data-placed] { margin-top: 2.5rem; }
      [data-placed] h2 { font-size: 1rem; margin: 0 0 0.5rem; }
      [data-placed] li {
        display: block;
        padding: 0.25rem 0;
        border-bottom: none;
      }
      .line { font-variant-numeric: tabular-nums; }
      .none { margin: 0; color: color-mix(in srgb, currentColor 70%, transparent); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
