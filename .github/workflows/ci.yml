name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    # The job's own bound. Without one it runs under the platform default of six
    # hours, and on 2026-08-19 a stalled package mirror spent fifteen minutes of
    # that before a person cancelled the run -- a person, not a timeout. Ten
    # minutes is above the slowest run that has ever passed here, so it fails
    # nothing this repository has actually completed, and well below that stall.
    timeout-minutes: 10

    # The menu test talks to a real database. The published port matches the
    # one in compose.yaml, which is also the default in the connection string,
    # so the port is written down in one place and CI needs no extra
    # environment to find it.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: table_ordering
          POSTGRES_PASSWORD: table_ordering_dev
          POSTGRES_DB: table_ordering
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U table_ordering -d table_ordering"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5
        with:
          # The convention checks read commit history, so a shallow clone
          # would change what they are able to evaluate.
          fetch-depth: 0

      # v5 rather than v4, because the v4 tag stopped moving. Every run this
      # repository produced carried one warning annotation naming
      # `pnpm/action-setup@v4` as targeting Node.js 20; the runner was already
      # forcing it onto Node.js 24, so only the declared `runs.using` was stale.
      # The fix shipped as v4.4.0 and again as v5.0.0 -- the same commit,
      # fc06bc1257f339d1d5d8b3a19a8cae5388b55320 -- and the floating v4 tag was
      # never advanced to it. A floating major is what the two steps around this
      # one use, so the number moves and the form does not; this does not stop
      # the next tag going stale, it puts the notice where `check-push` prints
      # it. Not v6: that rewrites how pnpm is installed, which ending a
      # deprecation does not require. ADR 0019.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The guest page's acceptance conditions are observed in a real browser,
      # and there is no `services:` block for one. The version comes from the
      # lockfile, and pnpm does not run the dependency's own install script, so
      # this is the only place a browser is fetched.
      #
      # No --with-deps. On this runner it installed no library Chromium needs --
      # apt reported every one of them already present -- and spent 6m12s
      # fetching 21MB of fonts, for scripts this page does not render, from the
      # mirror that stalled. The browser itself comes from a different host and
      # took ten seconds. ADR 0013.
      - run: pnpm --filter @table-ordering/guest exec playwright install chromium

      # CI is a clean tree with the commit already made, so every convention
      # check has something to evaluate. A skip there is a failure: `verify`
      # treats the CI environment variable the same as --require-history.
      #
      # The flag is the other half, and it is written out rather than inferred
      # from CI. This job provisions a database in `services:` and a browser in
      # the step above; --require-environment is what makes the run demand both,
      # so a skip of either fails here instead of quietly reporting success for
      # suites nobody ran. A job that provisioned neither would not pass it.
      - run: pnpm verify --require-environment
