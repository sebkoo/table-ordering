name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The convention checks read commit history, so a shallow clone
          # would change what they are able to evaluate.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CI is a clean tree with the commit already made, so every convention
      # check has something to evaluate. A skip here is a failure: `verify`
      # treats the CI environment variable the same as --require-history.
      - run: pnpm verify
