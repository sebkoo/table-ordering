name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    # The menu test talks to a real database. The published port matches the
    # one in compose.yaml, which is also the default in the connection string,
    # so the port is written down in one place and CI needs no extra
    # environment to find it.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: table_ordering
          POSTGRES_PASSWORD: table_ordering_dev
          POSTGRES_DB: table_ordering
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U table_ordering -d table_ordering"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5
        with:
          # The convention checks read commit history, so a shallow clone
          # would change what they are able to evaluate.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The guest page's acceptance conditions are observed in a real browser,
      # and there is no `services:` block for one. The version comes from the
      # lockfile, and pnpm does not run the dependency's own install script, so
      # this is the only place a browser is fetched.
      - run: pnpm --filter @table-ordering/guest exec playwright install --with-deps chromium

      # CI is a clean tree with the commit already made, so every convention
      # check has something to evaluate. A skip there is a failure: `verify`
      # treats the CI environment variable the same as --require-history.
      #
      # The flag is the other half, and it is written out rather than inferred
      # from CI. This job provisions a database in `services:` and a browser in
      # the step above; --require-environment is what makes the run demand both,
      # so a skip of either fails here instead of quietly reporting success for
      # suites nobody ran. A job that provisioned neither would not pass it.
      - run: pnpm verify --require-environment
