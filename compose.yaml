# Development dependencies only. The credentials below are development
# credentials and are inline on purpose: a fresh clone must come up with
# `docker compose up -d` and no environment file to fill in first.
#
# Postgres now has a client -- the API service and its tests -- so it publishes
# a host port. Not 5432: a developer working on this is likely to have their
# own Postgres already holding it, and a compose file that cannot come up
# beside one is a compose file nobody runs. The port is a literal because the
# API's default connection string carries the same number; a variable here
# would move one of the two and leave the other behind.
#
# Redis still publishes nothing, because nothing connects to it yet.
name: table-ordering

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: table_ordering
      POSTGRES_PASSWORD: table_ordering_dev
      POSTGRES_DB: table_ordering
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U table_ordering -d table_ordering']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
